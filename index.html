<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Panel</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --accent-soft:#eef2ff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1115;--card:#171a21;--text:#e8eaf0;--muted:#9aa3b2;--line:#262b36;--accent:#818cf8;--accent-soft:#1e2140;--shadow:none}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
  h1{margin:0;font-size:28px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:4px 0 0}
  .search{flex:1 1 260px;max-width:360px}
  .search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px}
  .name{font-weight:600;margin:0 0 2px}
  .desc{color:var(--muted);font-size:14px;margin:0}
  .tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .empty,.status{color:var(--muted);text-align:center;padding:40px 0}
  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="titulo">Mi Panel</h1>
      <p class="sub" id="subtitulo">Aplicaciones, planillas y documentos</p>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Buscar…" autocomplete="off"></div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="app"><p class="status">Cargando…</p></main>
  <footer id="foot"></footer>
</div>

<script>
/* ============ CONFIGURACIÓN (lo único que se toca una vez) ============ */
const CONFIG = {
  // Pegá acá el link de la hoja publicada como CSV
  // (Archivo > Compartir > Publicar en la web > elegir la pestaña > formato CSV).
  // Si queda vacío, se muestra un ejemplo de demostración.
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAUKQa5J2Kk6wjjUZt6-89UwQTfK46XPDwMr3oN8risYYIQYTe57D3-aPf5rzuxhWBcOpNKj3zbCv3/pub?gid=51196652&single=true&output=csv",
  TITULO: "Mi Panel",
  SUBTITULO: "Aplicaciones, planillas y documentos",
  CACHE_MINUTOS: 5
};
/* ====================================================================== */

const DEMO = `Nombre,Descripcion,URL,Categoria,Icono,Activo,Orden
Buscador de películas,Búsqueda por tags y actores,https://example.com/peliculas,Aplicaciones,🎬,SI,1
Indicadores económicos,Planilla de seguimiento,https://docs.google.com/spreadsheets/d/xxxx,Planillas,📊,SI,2
Autoguardado,Script de autoguardado de texto,https://github.com/usuario/repo,Repositorios,💾,SI,3
Manual interno,Documento de procedimientos,https://drive.google.com/file/d/xxxx,Documentos,📄,SI,4
Proyecto en pausa,Este no se muestra (Activo = NO),https://example.com/oculto,Aplicaciones,🚧,NO,5`;

const $ = s => document.querySelector(s);
let items = [], cat = "Todas", term = "";

function parseCSV(t){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c=='"'){ if(t[i+1]=='"'){cur+='"';i++} else q=false }
      else cur+=c;
    } else if(c=='"') q=true;
    else if(c==','){row.push(cur);cur=""}
    else if(c=='\n'||c=='\r'){
      if(c=='\r'&&t[i+1]=='\n')i++;
      row.push(cur);cur="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    } else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}

function toItems(csv){
  const [head,...rows]=parseCSV(csv);
  const norm=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const idx={}; head.forEach((h,i)=>idx[norm(h)]=i);
  const get=(r,k)=>(r[idx[k]]??"").trim();
  return rows.map(r=>({
    nombre:get(r,"nombre"), desc:get(r,"descripcion"), url:get(r,"url"),
    cat:get(r,"categoria")||"General", ico:get(r,"icono")||"🔗",
    activo:/^(si|sí|true|1|x|yes)$/i.test(get(r,"activo")),
    orden:parseFloat(get(r,"orden"))||9999
  })).filter(x=>x.activo && x.nombre && /^https?:\/\//i.test(x.url))
    .sort((a,b)=>a.orden-b.orden);
}

function tipo(u){
  if(u.includes("docs.google.com/spreadsheets"))return "Google Sheets";
  if(u.includes("docs.google.com/document"))return "Google Docs";
  if(u.includes("docs.google.com/presentation"))return "Google Slides";
  if(u.includes("drive.google.com"))return "Drive";
  if(u.includes("github.com"))return "GitHub";
  try{return new URL(u).hostname.replace(/^www\./,"")}catch{return ""}
}

const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  const cats=["Todas",...new Set(items.map(i=>i.cat))];
  $("#chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const t=term.toLowerCase();
  const list=items.filter(i=>(cat==="Todas"||i.cat===cat)&&(!t||(i.nombre+" "+i.desc+" "+i.cat).toLowerCase().includes(t)));
  if(!list.length){$("#app").innerHTML='<p class="empty">No hay accesos para mostrar.</p>';return}
  const groups={}; list.forEach(i=>(groups[i.cat]??=[]).push(i));
  $("#app").innerHTML=Object.entries(groups).map(([g,arr])=>`
    <h2>${esc(g)}</h2>
    <div class="grid">${arr.map(i=>`
      <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
        <div class="ico">${esc(i.ico)}</div>
        <div><p class="name">${esc(i.nombre)}</p><p class="desc">${esc(i.desc)}</p><span class="tag">${esc(tipo(i.url))}</span></div>
      </a>`).join("")}</div>`).join("");
}

async function load(){
  $("#titulo").textContent=CONFIG.TITULO; document.title=CONFIG.TITULO;
  $("#subtitulo").textContent=CONFIG.SUBTITULO;
  let csv=DEMO, nota="Modo demostración: configurá SHEET_CSV_URL para usar tu hoja.";
  if(CONFIG.SHEET_CSV_URL){
    const key="panel_cache";
    try{
      const c=JSON.parse(localStorage.getItem(key)||"null");
      if(c&&Date.now()-c.t<CONFIG.CACHE_MINUTOS*60000){csv=c.csv;nota=""}
      else throw 0;
    }catch{
      try{
        const r=await fetch(CONFIG.SHEET_CSV_URL,{cache:"no-store"});
        if(!r.ok)throw 0;
        csv=await r.text(); nota="";
        try{localStorage.setItem(key,JSON.stringify({t:Date.now(),csv}))}catch{}
      }catch{
        try{const c=JSON.parse(localStorage.getItem(key)||"null"); if(c){csv=c.csv;nota="Sin conexión con la hoja: mostrando la última copia guardada."}
          else{$("#app").innerHTML='<p class="status">No se pudo leer la hoja. Revisá que esté publicada en la web.</p>';return}}catch{return}
      }
    }
  }
  items=toItems(csv); $("#foot").textContent=nota; render();
}

$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;render()}});
$("#q").addEventListener("input",e=>{term=e.target.value;render()});
load();
</script>
</body>
</html>
