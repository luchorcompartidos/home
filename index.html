<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="v0.2.6">
<title>Mi Panel</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1115;--card:#171a21;--text:#e8eaf0;--muted:#9aa3b2;--line:#262b36;--shadow:none}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
  h1{margin:0;font-size:28px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:4px 0 0}
  .tools{flex:1 1 300px;max-width:440px;display:flex;gap:8px}
  .tools input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;outline:none}
  .tools input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .btn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn[disabled]{opacity:.6;cursor:progress}
  .btn .spin{display:inline-block}
  .btn[disabled] .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .chip{--c:var(--accent);border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip.on{background:var(--c);border-color:var(--c);color:#fff}
  .chip.on .dot{background:#fff}
  section{--c:var(--accent)}
  h2{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 12px}
  h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:var(--c)}
  .ico{flex:none;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));display:grid;place-items:center;font-size:22px;overflow:hidden}
  .ico img{width:28px;height:28px;object-fit:contain}
  .name{font-weight:600;margin:0 0 2px}
  .desc{color:var(--muted);font-size:14px;margin:0}
  .tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .empty,.status{color:var(--muted);text-align:center;padding:40px 0}
  .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ver{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer}
  .ver:hover{border-color:var(--accent);color:var(--accent)}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:20px;max-width:min(560px,92vw);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 8px}
  dialog .rels{max-height:60vh;overflow:auto}
  .rel{border-top:1px solid var(--line);padding:10px 0}
  .rel b{color:var(--accent)}
  .rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--muted);margin:4px 0 0}
  .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
  .acts a,.acts button{text-decoration:none;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
  .acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .muted{color:var(--muted)}
  .ver.new{border-color:#d97706;color:#d97706}
  .upd{display:none;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;padding:10px 14px;border:1px solid #d97706;border-radius:12px;background:color-mix(in srgb,#d97706 12%,var(--card));font-size:14px}
  .upd.on{display:flex}
  .upd button{padding:7px 12px;border-radius:10px;border:1px solid #d97706;background:#d97706;color:#fff;font-size:14px;cursor:pointer}
  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="ttl"><h1 id="titulo">Mi Panel</h1><button class="ver" id="verBtn" type="button" title="Versión">v—</button></div>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Buscar…" autocomplete="off">
      <button class="btn" id="refresh" type="button" title="Leer la hoja ahora, sin usar la copia guardada"><span class="spin">↻</span><span id="refreshTxt">Actualizar</span></button>
    </div>
  </header>
  <div class="upd" id="upd" role="status"><span id="updTxt">Hay una versión nueva, recargá.</span><button type="button" id="updBtn">Recargar</button></div>
  <dialog id="dlg"></dialog>
  <div class="chips" id="chips"></div>
  <main id="app"><p class="status">Cargando…</p></main>
  <footer id="foot"></footer>
</div>

<script>
/* ================= CONFIGURACIÓN (se toca una sola vez) =================
   Publicá cada pestaña de la hoja por separado:
   Archivo > Compartir > Publicar en la web > elegir la pestaña > formato CSV.
   - ACCESOS_CSV_URL: link CSV de la pestaña "Accesos" (obligatorio).
   - CONFIG_CSV_URL:  link CSV de la pestaña "Configuracion" (opcional).
   Si ACCESOS_CSV_URL queda vacío, se muestra un ejemplo de demostración.
   TITULO y SUBTITULO de acá solo se usan si la hoja no los define.        */
const CONFIG = {
  ACCESOS_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAUKQa5J2Kk6wjjUZt6-89UwQTfK46XPDwMr3oN8risYYIQYTe57D3-aPf5rzuxhWBcOpNKj3zbCv3/pub?gid=12797362&single=true&output=csv",
  CONFIG_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAUKQa5J2Kk6wjjUZt6-89UwQTfK46XPDwMr3oN8risYYIQYTe57D3-aPf5rzuxhWBcOpNKj3zbCv3/pub?gid=1050391097&single=true&output=csv",
  TITULO: "Mi Panel",
  SUBTITULO: "Aplicaciones, planillas y documentos",
  CACHE_MINUTOS: 5
};
/* ======================================================================= */

const DEMO_ACCESOS = `Nombre,Descripcion,URL,Categoria,Icono,Activo,Orden
Buscador de películas,Búsqueda por tags y actores,https://example.com/peliculas,Aplicaciones,🎬,SI,1
Indicadores económicos,Planilla de seguimiento,https://docs.google.com/spreadsheets/d/xxxx,Planillas,📊,SI,2
Autoguardado,Script de autoguardado de texto,https://github.com/usuario/repo,Repositorios,💾,SI,3
Manual interno,Documento de procedimientos,https://drive.google.com/file/d/xxxx,Documentos,📄,SI,4
Ícono desde una imagen,La columna Icono también acepta un link a PNG o SVG,https://lucide.dev,Aplicaciones,https://unpkg.com/lucide-static/icons/rocket.svg,SI,5
Proyecto en pausa,Este no se muestra (Activo = NO),https://example.com/oculto,Aplicaciones,🚧,NO,6`;

const DEMO_CONFIG = `Parametro,Valor,,Categoria,Orden,Color
Titulo,Mi Panel,,Aplicaciones,1,#4f46e5
Subtitulo,"Aplicaciones, planillas y documentos",,Planillas,2,#16a34a
Color principal,#4f46e5,,Repositorios,3,#0891b2
,,,Documentos,4,#ea580c`;

const $ = s => document.querySelector(s);
const CACHE_KEY = "panel_cache_v2";
let items = [], cfg = null, cat = "Todas", term = "";

/* ---------- utilidades ---------- */
const norm = s => (s ?? "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okColor = v => !!v && CSS.supports("color", v) ? v : "";
const isUrl = v => /^https?:\/\//i.test(v);
/* "github-apk:usuario/repo" en la columna URL = link al .apk de la última Release de ese repo */
const apkRepo = v => (/^github-apk:\s*([\w.-]+\/[\w.-]+)\s*$/i.exec(v||"")||[])[1] || "";

function parseCSV(t){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c=='"'){ if(t[i+1]=='"'){cur+='"';i++} else q=false }
      else cur+=c;
    } else if(c=='"') q=true;
    else if(c==','){row.push(cur);cur=""}
    else if(c=='\n'||c=='\r'){
      if(c=='\r'&&t[i+1]=='\n')i++;
      row.push(cur);cur="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    } else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}

/* Devuelve filas como objetos con claves normalizadas (sin acentos ni mayúsculas) */
function table(csv){
  const [head=[], ...rows] = parseCSV(csv || "");
  const keys = head.map(norm);
  return rows.map(r => { const o={}; keys.forEach((k,i)=>{ if(k) o[k]=(r[i]??"").trim() }); return o; });
}

/* ---------- pestaña Accesos ---------- */
function toItems(csv){
  return table(csv).map(r=>({
    nombre:r.nombre||"", desc:r.descripcion||"", url:r.url||"", apk:apkRepo(r.url),
    cat:r.categoria||"General", ico:r.icono||"🔗",
    activo:/^(si|sí|true|1|x|yes)$/i.test(r.activo||""),
    orden:parseFloat(r.orden)
  })).map(x=>x.apk ? {...x, url:`https://github.com/${x.apk}/releases/latest`} : x)
    .filter(x=>x.activo && x.nombre && isUrl(x.url))
    .map(x=>({...x, orden:isNaN(x.orden)?9999:x.orden}))
    .sort((a,b)=>a.orden-b.orden);
}

/* ---------- pestaña Configuracion ----------
   Columnas A-B: Parametro | Valor   (Titulo, Subtitulo, Color principal)
   Columnas D-F: Categoria | Orden | Color                                 */
function toConfig(csv){
  const out = { params:{}, cats:{} };
  table(csv).forEach(r=>{
    if(r.parametro) out.params[norm(r.parametro)] = r.valor || "";
    if(r.categoria){
      const o = parseFloat(r.orden);
      out.cats[norm(r.categoria)] = { orden:isNaN(o)?9999:o, color:okColor(r.color) };
    }
  });
  return out;
}

const catInfo = name => (cfg && cfg.cats[norm(name)]) || { orden:9999, color:"" };

function orderedCats(){
  const seen=[]; items.forEach(i=>{ if(!seen.includes(i.cat)) seen.push(i.cat) });
  return seen.map((c,ix)=>({c,ix,o:catInfo(c).orden}))
             .sort((a,b)=>a.o-b.o || a.ix-b.ix).map(x=>x.c);
}

function tipo(u){
  if(u.includes("docs.google.com/spreadsheets"))return "Google Sheets";
  if(u.includes("docs.google.com/document"))return "Google Docs";
  if(u.includes("docs.google.com/presentation"))return "Google Slides";
  if(u.includes("docs.google.com/forms"))return "Google Forms";
  if(u.includes("drive.google.com"))return "Drive";
  if(u.includes("github.com"))return "GitHub";
  try{return new URL(u).hostname.replace(/^www\./,"")}catch{return ""}
}

const colorStyle = c => { const col = catInfo(c).color; return col ? ` style="--c:${esc(col)}"` : ""; };

function icon(v){
  if(isUrl(v)) return `<img src="${esc(v)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('🔗')">`;
  return esc(v);
}

/* ---------- dibujo ---------- */
function render(){
  const cats = orderedCats();
  if(cat!=="Todas" && !cats.includes(cat)) cat="Todas";
  $("#chips").innerHTML = ["Todas",...cats].map(c=>
    `<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}"${c==="Todas"?"":colorStyle(c)}>${c==="Todas"?"":'<span class="dot"></span>'}${esc(c)}</button>`).join("");
  const t = norm(term);
  const list = items.filter(i=>(cat==="Todas"||i.cat===cat) && (!t||norm(i.nombre+" "+i.desc+" "+i.cat).includes(t)));
  if(!list.length){ $("#app").innerHTML='<p class="empty">No hay accesos para mostrar.</p>'; return; }
  $("#app").innerHTML = cats.filter(c=>list.some(i=>i.cat===c)).map(c=>`
    <section${colorStyle(c)}>
      <h2>${esc(c)}</h2>
      <div class="grid">${list.filter(i=>i.cat===c).map(i=>`
        <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
          <div class="ico">${icon(i.ico)}</div>
          <div><p class="name">${esc(i.nombre)}</p><p class="desc">${esc(i.desc)}</p><span class="tag">${esc(i.etiqueta || tipo(i.url))}</span></div>
        </a>`).join("")}</div>
    </section>`).join("");
}

function applyConfig(){
  const p = (cfg && cfg.params) || {};
  const titulo = p["titulo"] || CONFIG.TITULO;
  $("#titulo").textContent = titulo; document.title = titulo;
  $("#subtitulo").textContent = p["subtitulo"] ?? CONFIG.SUBTITULO;
  const acc = okColor(p["color principal"]);
  if(acc) document.documentElement.style.setProperty("--accent", acc);
  else document.documentElement.style.removeProperty("--accent");
}

/* ---------- instaladores APK (última Release de GitHub) ---------- */
const APK_KEY = "mipanel_apk_v1", APK_MIN = 10;
async function ultimaApk(repo){
  let c={}; try{ c=JSON.parse(localStorage.getItem(APK_KEY)||"{}") }catch{}
  if(c[repo] && Date.now()-c[repo].t < APK_MIN*60000) return c[repo];
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/releases/latest`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(), a = (j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(!a) throw new Error("sin .apk");
    c[repo] = { t:Date.now(), url:a.browser_download_url, ver:j.tag_name };
    try{ localStorage.setItem(APK_KEY, JSON.stringify(c)) }catch{}
    return c[repo];
  }catch(e){ return c[repo] || null; }   // sin conexión: última conocida, o queda el link a la página de Releases
}
async function resolverApks(){
  const lista = items.filter(i=>i.apk);
  if(!lista.length) return;
  await Promise.all(lista.map(async i=>{
    const d = await ultimaApk(i.apk);
    if(d){ i.url = d.url; i.etiqueta = "Descargar " + d.ver; } else i.etiqueta = "Ver versiones";
  }));
  render();
}

/* ---------- lectura de la hoja ---------- */
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||"null") }catch{ return null } }
function writeCache(d){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)) }catch{} }

async function fetchCSV(url){
  const u = url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();   // evita copias intermedias
  const r = await fetch(u, { cache:"no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  const txt = await r.text();
  if(/^\s*(<!doctype html|<html)/i.test(txt)) throw new Error("La hoja no está publicada como CSV");
  return txt;
}

function setBusy(b){
  $("#refresh").disabled = b;
  $("#refreshTxt").textContent = b ? "Actualizando…" : "Actualizar";
}

const fmt = t => new Date(t).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

async function load(force=false){
  setBusy(true);
  let acc = DEMO_ACCESOS, conf = DEMO_CONFIG, t = null,
      nota = "Modo demostración: configurá ACCESOS_CSV_URL para usar tu hoja.";

  if(CONFIG.ACCESOS_CSV_URL){
    const src = CONFIG.ACCESOS_CSV_URL + "|" + CONFIG.CONFIG_CSV_URL;
    const c = readCache(), valid = c && c.src === src;
    if(!force && valid && Date.now() - c.t < CONFIG.CACHE_MINUTOS*60000){
      ({acc, conf, t} = c); nota = "";
    } else {
      try{
        const [a, k] = await Promise.all([
          fetchCSV(CONFIG.ACCESOS_CSV_URL),
          CONFIG.CONFIG_CSV_URL ? fetchCSV(CONFIG.CONFIG_CSV_URL).catch(()=>null) : Promise.resolve("")
        ]);
        acc = a; t = Date.now(); nota = "";
        if(k === null){ conf = valid ? c.conf : ""; nota = "No se pudo leer la pestaña Configuracion: se usan los valores anteriores."; }
        else conf = k;
        writeCache({ src, t, acc, conf });
      }catch(e){
        if(valid){ ({acc, conf, t} = c); nota = "Sin conexión con la hoja: mostrando la última copia guardada."; }
        else{
          $("#app").innerHTML = '<p class="status">No se pudo leer la hoja. Revisá que la pestaña esté publicada en la web como CSV.</p>';
          $("#foot").textContent = ""; setBusy(false); return;
        }
      }
    }
  }

  cfg = toConfig(conf); items = toItems(acc);
  applyConfig(); render(); resolverApks();
  $("#foot").textContent = [nota, t ? "Actualizado: " + fmt(t) : ""].filter(Boolean).join(" · ");
  setBusy(false);
}

$("#chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(b){ cat=b.dataset.c; render(); } });
$("#q").addEventListener("input", e=>{ term=e.target.value; render(); });
$("#refresh").addEventListener("click", ()=>load(true));
/* ---------- Versión (estándar caja de apps) ----------
   1) El número está escrito en el HTML: <meta name="app-version">. Se ve siempre,
      sin conexión, en Apps Script y aunque el navegador tenga una copia vieja.
   2) Fecha y Changelog se leen de las Releases de GitHub (sin conexión: última copia guardada).
      La fecha es la del archivo más reciente adjunto a esa Release (si no hay, la de publicación).
   3) Si GitHub tiene una versión más alta que la del archivo: aviso "Hay una versión nueva, recargá". */
const REPO = "luchorcompartidos/home";
const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
const RELS_KEY = "panel_rels";
let rels = null; try{ rels = JSON.parse(localStorage.getItem(RELS_KEY)||"null") }catch{}
// Estado de la última consulta a GitHub: así el diálogo distingue "no está publicada" de "no se pudo consultar"
let relsAt = 0; try{ relsAt = +localStorage.getItem(RELS_KEY+"_t") || 0 }catch{}
let lastFail = false, loading = null, reintento = false;
const fmtDT = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const semv = t => (t.replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
const ultima = () => rels && rels[0];
const hayNueva = () => !!(ultima() && APP_VERSION !== "v—" && cmpV(ultima().tag, APP_VERSION) < 0);
function showVer(){
  const b = $("#verBtn"), n = hayNueva();
  b.textContent = APP_VERSION + (n ? " ⬆" : "");
  b.classList.toggle("new", n);
  b.title = n ? "Hay una versión nueva: " + ultima().tag : "Versión";
  $("#upd").classList.toggle("on", n);
  if(n) $("#updTxt").textContent = `Hay una versión nueva (${ultima().tag}), recargá.`;
}
function loadRels(){ if(!loading) loading = doLoadRels().finally(()=>{ loading = null }); return loading; }
async function doLoadRels(){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
    if(!r.ok){ lastFail = true; return; }
    lastFail = false; relsAt = Date.now(); try{ localStorage.setItem(RELS_KEY+"_t", String(relsAt)) }catch{}
    rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
      const fechas = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
      return { tag:x.tag_name, date:fechas.length ? fechas[fechas.length-1] : (x.published_at||x.created_at),
               deArchivo:fechas.length>0, body:x.body||"", url:x.html_url };
    }).sort((a,b)=>cmpV(a.tag,b.tag));
    try{ localStorage.setItem(RELS_KEY, JSON.stringify(rels)) }catch{}
    showVer();
  }catch{ lastFail = true; }
}
function recargar(){ const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
function dialog(html){
  const d = $("#dlg"); d.innerHTML = html;
  d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
  if(!d.open) d.showModal();
  return d;
}
function openVer(){
  const r = (rels||[]).find(x=>x.tag===APP_VERSION);
  const hace = relsAt ? ` (información de hace ${Math.max(1, Math.round((Date.now()-relsAt)/60000))} min)` : "";
  // Si la lista guardada no tiene esta versión, se vuelve a consultar GitHub antes de concluir nada
  if(!r && !reintento && navigator.onLine !== false){ reintento = true; dialog(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="muted">Consultando GitHub…</p>`); loadRels().then(()=>{ if($("#dlg").open) openVer(); reintento = false; }); return; }
  const fecha = r ? (r.deArchivo ? "Archivos actualizados el " : "Publicada el ") + "<b>" + fmtDT(r.date) + "</b>"
              : navigator.onLine === false ? `Sin conexión: no se puede consultar GitHub ahora${rels ? hace : ""}.`
              : lastFail ? `No se pudo consultar GitHub (puede ser un límite de consultas seguidas). Probá de nuevo en unos minutos${rels ? hace : ""}.`
              : rels ? "Esta versión todavía no figura en las Releases de GitHub. Se publica unos segundos después de cada entrega: probá de nuevo en un minuto."
              : "Fecha no disponible (requiere conexión).";
  const nueva = hayNueva() ? `<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b></p>` : "";
  const d = dialog(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="muted">${fecha}</p>${nueva}
    <div class="acts">${hayNueva()?'<button class="pri" id="vRec" type="button">↻ Recargar</button>':""}<button ${hayNueva()?"":'class="pri"'} id="vLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
  d.querySelector("#vLog").onclick = openLog;
  const rb = d.querySelector("#vRec"); if(rb) rb.onclick = recargar;
}
function openLog(){
  const list = (rels||[]).map(r=>`<div class="rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="muted">(la que estás usando)</span>':""} · <span class="muted">${fmtDT(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
  dialog(`<h3>Changelog</h3><div class="rels">${list || '<p class="muted">Sin datos todavía (requiere conexión).</p>'}</div>
    <div class="acts"><a href="https://github.com/${REPO}/releases" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
}
$("#dlg").addEventListener("click", e=>{ if(e.target.id==="dlg") e.target.close(); });
$("#verBtn").addEventListener("click", openVer);
$("#updBtn").addEventListener("click", recargar);
// Se vuelve a consultar al volver a la app (si la información tiene más de 10 minutos) y al recuperar la conexión
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-relsAt > 600000) loadRels(); });
window.addEventListener("online", ()=>loadRels());
showVer(); loadRels();

load();
</script>
</body>
</html>
